<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שליחת הודעה מהירה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #0b1210;
    --bg-2: #10201b;
    --card-bg: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.08);
    --text-1: #f2f5f3;
    --text-2: #9fb0aa;
    --accent: #25d366;
    --accent-dim: #1a9e4d;
    --accent-glow: rgba(37,211,102,0.35);
    --error: #ff6b6b;
    --input-bg: rgba(255,255,255,0.03);
    --shadow: 0 20px 60px rgba(0,0,0,0.45);
  }

  [data-theme="light"] {
    --bg-1: #eef4f1;
    --bg-2: #dcebe3;
    --card-bg: rgba(255,255,255,0.75);
    --card-border: rgba(0,0,0,0.06);
    --text-1: #10201b;
    --text-2: #5b6b64;
    --accent: #1fa855;
    --accent-dim: #17843f;
    --accent-glow: rgba(31,168,85,0.25);
    --error: #d9433e;
    --input-bg: rgba(0,0,0,0.03);
    --shadow: 0 20px 50px rgba(16,32,27,0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Heebo', sans-serif;
    color: var(--text-1);
    background:
      radial-gradient(circle at 15% 10%, var(--accent-glow), transparent 40%),
      radial-gradient(circle at 85% 90%, var(--accent-glow), transparent 45%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: background 0.4s ease, color 0.4s ease;
  }

  .theme-toggle {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    color: var(--text-1);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    transition: transform 0.2s ease;
  }
  .theme-toggle:active { transform: scale(0.9); }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 36px 30px 30px;
    backdrop-filter: blur(18px);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent-glow), transparent 60%);
    opacity: 0.5;
    pointer-events: none;
  }

  .icon-badge {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
    box-shadow: 0 10px 30px var(--accent-glow);
  }
  .icon-badge svg { width: 28px; height: 28px; fill: #fff; }

  h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }
  .subtitle {
    color: var(--text-2);
    font-size: 14px;
    margin: 0 0 28px;
    font-weight: 400;
  }

  .field {
    position: relative;
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-2);
    margin-bottom: 8px;
    letter-spacing: 0.01em;
  }

  .phone-wrap {
    display: flex;
    flex-direction: row-reverse;
    align-items: center;
    background: var(--input-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .phone-wrap.focused {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow);
  }
  .phone-wrap.invalid {
    border-color: var(--error);
  }
  .prefix {
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    color: var(--text-2);
    padding: 0 14px;
    border-right: 1.5px solid var(--card-border);
    height: 48px;
    display: flex;
    align-items: center;
    user-select: none;
  }

  input[type="tel"], textarea {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-1);
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    padding: 0 14px;
    height: 48px;
  }
  textarea {
    font-family: 'Heebo', sans-serif;
    height: auto;
    min-height: 100px;
    padding: 14px;
    resize: vertical;
    background: var(--input-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 14px;
    line-height: 1.5;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow);
  }

  .hint {
    font-size: 12px;
    margin-top: 7px;
    min-height: 16px;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: color 0.2s ease;
  }
  .hint.ok { color: var(--accent); }
  .hint.err { color: var(--error); }
  .hint.neutral { color: var(--text-2); }

  .char-count {
    text-align: left;
    font-size: 11px;
    color: var(--text-2);
    font-family: 'Space Mono', monospace;
    margin-top: 6px;
  }

  button.send {
    width: 100%;
    height: 54px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    color: #fff;
    font-family: 'Heebo', sans-serif;
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    box-shadow: 0 12px 28px var(--accent-glow);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
    margin-top: 6px;
  }
  button.send:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    box-shadow: none;
  }
  button.send:not(:disabled):hover { transform: translateY(-2px); }
  button.send:not(:disabled):active { transform: translateY(0) scale(0.98); }
  button.send svg { width: 20px; height: 20px; fill: #fff; }

  .footer-note {
    text-align: center;
    color: var(--text-2);
    font-size: 11.5px;
    margin-top: 18px;
  }
</style>
</head>
<body data-theme="dark">

<button class="theme-toggle" id="themeToggle" aria-label="החלף מצב תצוגה">🌙</button>

<div class="card">
  <div class="icon-badge">
    <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.71.44 3.37 1.29 4.85L2 22l5.35-1.4a9.9 9.9 0 0 0 4.69 1.19h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.85 9.85 0 0 0 12.04 2zm5.8 14.06c-.24.68-1.4 1.31-1.93 1.35-.5.05-1.02.24-3.4-.71-2.87-1.15-4.72-4.06-4.86-4.25-.14-.19-1.17-1.55-1.17-2.96 0-1.4.74-2.09 1-2.38.26-.28.57-.35.76-.35.19 0 .38 0 .55.01.18.01.42-.07.65.5.24.58.81 2 .88 2.14.07.14.12.31.02.5-.1.19-.15.31-.29.48-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.29.76 1.25 1.63 2.02 1.12.99 2.06 1.3 2.35 1.45.29.14.46.12.63-.07.17-.19.72-.84.91-1.13.19-.29.38-.24.63-.14.26.1 1.66.78 1.94.92.29.15.48.22.55.34.07.13.07.72-.17 1.4z"/></svg>
  </div>
  <h1>שליחת הודעה מהירה</h1>
  <p class="subtitle">מלא/י מספר טלפון ישראלי, הוסיפ/י הודעה אם תרצה, ושלח ישירות ל-WhatsApp</p>

  <div class="field">
    <label for="phone">מספר טלפון (ישראלי)</label>
    <div class="phone-wrap" id="phoneWrap">
      <span class="prefix">972+</span>
      <input type="tel" id="phone" placeholder="50-1234567" inputmode="numeric" autocomplete="tel">
    </div>
    <div class="hint neutral" id="phoneHint">נא להזין מספר ישראלי תקין</div>
  </div>

  <div class="field">
    <label for="message">הודעה (אופציונלי)</label>
    <textarea id="message" placeholder="כתוב/י כאן את ההודעה..." maxlength="500"></textarea>
    <div class="char-count"><span id="charCount">0</span>/500</div>
  </div>

  <button class="send" id="sendBtn" disabled>
    <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.71.44 3.37 1.29 4.85L2 22l5.35-1.4a9.9 9.9 0 0 0 4.69 1.19h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.85 9.85 0 0 0 12.04 2zm5.8 14.06c-.24.68-1.4 1.31-1.93 1.35-.5.05-1.02.24-3.4-.71-2.87-1.15-4.72-4.06-4.86-4.25-.14-.19-1.17-1.55-1.17-2.96 0-1.4.74-2.09 1-2.38.26-.28.57-.35.76-.35.19 0 .38 0 .55.01.18.01.42-.07.65.5.24.58.81 2 .88 2.14.07.14.12.31.02.5-.1.19-.15.31-.29.48-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.29.76 1.25 1.63 2.02 1.12.99 2.06 1.3 2.35 1.45.29.14.46.12.63-.07.17-.19.72-.84.91-1.13.19-.29.38-.24.63-.14.26.1 1.66.78 1.94.92.29.15.48.22.55.34.07.13.07.72-.17 1.4z"/></svg>
    שלח ב-WhatsApp
  </button>

  <p class="footer-note">הלחיצה תפתח את WhatsApp עם ההודעה מוכנה לשליחה</p>
</div>

<script>
  const themeToggle = document.getElementById('themeToggle');
  const body = document.body;
  const saved = localStorage.getItem('wa-theme');
  if (saved) {
    body.setAttribute('data-theme', saved);
    themeToggle.textContent = saved === 'light' ? '☀️' : '🌙';
  }
  themeToggle.addEventListener('click', () => {
    const current = body.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    body.setAttribute('data-theme', next);
    themeToggle.textContent = next === 'light' ? '☀️' : '🌙';
    localStorage.setItem('wa-theme', next);
  });

  const phoneInput = document.getElementById('phone');
  const phoneWrap = document.getElementById('phoneWrap');
  const phoneHint = document.getElementById('phoneHint');
  const messageInput = document.getElementById('message');
  const charCount = document.getElementById('charCount');
  const sendBtn = document.getElementById('sendBtn');

  let validNumber = null;

  function normalizePhone(raw) {
    let digits = raw.replace(/\D/g, '');
    if (digits.startsWith('972')) digits = digits.slice(3);
    if (digits.startsWith('0')) digits = digits.slice(1);
    return digits;
  }

  function validate() {
    const digits = normalizePhone(phoneInput.value);
    const isValid = /^5\d{8}$/.test(digits) || /^[2-9]\d{7,8}$/.test(digits);
    phoneWrap.classList.remove('invalid', 'focused');
    if (phoneInput.value.trim() === '') {
      phoneHint.textContent = 'נא להזין מספר ישראלי תקין';
      phoneHint.className = 'hint neutral';
      validNumber = null;
    } else if (isValid) {
      phoneHint.textContent = '✓ מספר תקין';
      phoneHint.className = 'hint ok';
      validNumber = '972' + digits;
    } else {
      phoneWrap.classList.add('invalid');
      phoneHint.textContent = '✕ מספר לא תקין';
      phoneHint.className = 'hint err';
      validNumber = null;
    }
    sendBtn.disabled = !validNumber;
  }

  phoneInput.addEventListener('input', validate);
  phoneInput.addEventListener('focus', () => phoneWrap.classList.add('focused'));
  phoneInput.addEventListener('blur', () => phoneWrap.classList.remove('focused'));

  messageInput.addEventListener('input', () => {
    charCount.textContent = messageInput.value.length;
  });

  sendBtn.addEventListener('click', () => {
    if (!validNumber) return;
    const text = encodeURIComponent(messageInput.value.trim());
    const url = `https://wa.me/${validNumber}${text ? '?text=' + text : ''}`;
    window.open(url, '_blank');
  });

  validate();
</script>

</body>
</html>
